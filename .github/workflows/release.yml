name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # the examples resolve @notuslabs/yail from the workspace, through dist
      - run: pnpm typecheck
      - run: pnpm test

  # Publishes packages/yail when the version in its package.json is not on npm yet.
  # Auth is npm trusted publishing (OIDC): no token, provenance attached automatically.
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/yail
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$(npm view "@notuslabs/yail@$version" version 2>/dev/null)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm publish
      - if: steps.version.outputs.publish == 'true'
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
